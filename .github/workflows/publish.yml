# Publishes n8n-nodes-keeva to npm with a provenance statement when a GitHub release is published.
#
# n8n requires community nodes to be published from GitHub Actions with npm provenance; `--provenance` together
# with `id-token: write` produces a signed statement that links the package to this workflow, repository and commit.
#
# One-time setup, either:
#   A. Trusted publishing (recommended): on npmjs.com open the package's settings, "Trusted Publishers", add GitHub
#      Actions with owner Atelix, repository n8n-nodes-keeva and workflow publish.yml. Leave NPM_TOKEN unset.
#      (For the very first publish the package does not exist on npm yet; use option B once, then switch.)
#   B. A granular npm access token with publish rights, stored as the NPM_TOKEN repository secret.
#
# Releasing: bump "version" in package.json and add a CHANGELOG.md entry on main, then publish a GitHub release whose
# tag is that version with a "v" prefix (for example v0.1.0). The workflow refuses a tag that does not match or that
# is not on main, and tests the tag before it publishes.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag is not a supported semantic version: $TAG" >&2
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$VERSION" && "$TAG" != "$VERSION" ]]; then
            echo "Release tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

          # Only code that reached main is published to npm.
          commit="$(git rev-parse "$TAG^{commit}")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Release $TAG points at $commit, which is not on main. Publish releases from main only." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  integration:
    name: Continuous integration
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  publish:
    name: Publish to npm
    needs:
      - version
      - integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      # Required to mint the OIDC token for the provenance statement (and for trusted publishing).
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs lint, type-check, tests and the build again right before publishing.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Empty when trusted publishing is used; npm then exchanges the OIDC token instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
